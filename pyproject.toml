[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deepvision"
version = "0.1.0"
description = "AI-generated video detection"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "opencv-python-headless",
    "albumentations",
    "pyyaml",
    "tqdm",
    "scikit-learn",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["ffmpeg: tests that need ffmpeg/ffprobe on PATH"]
