  - {name: opensource_v2v_ltx, dir: OpenSource-V2V/LTX, split: aigvd_test, label: 1, generator: V2V-LTX}
  - {name: real_real, dir: Real/Real, split: aigvd_test, label: 0, generator: OpenVid-HD}
  - {name: opensource_t2v_videocrafter, dir: OpenSource-T2V/VideoCrafter, split: aigvd_test, label: 1, generator: T2V-VideoCrafter}
  - {name: opensource_t2v_wan2_1, dir: OpenSource-T2V/Wan2.1, split: aigvd_test, label: 1, generator: T2V-Wan2.1}

validation:
  min_duration: 2.0
  min_side: 224
  min_fps: 8
  filter_eval: true
  probe_timeout: 60
  decode_timeout: 120

extraction:
  num_frames: 16
  base_fps: 8
  min_duration_for_base_fps: 2.0
  window: center
  jpeg_quality: 95
  max_short_side: 224
  decode_timeout: 300
  min_free_gb: 50
  output: clips

clips:
  size: 224
  crop: square
  jpeg_quality: 95
  keep_native: []
  bottleneck: 192

shards:
  videos_per_shard: 3000

drive:
  remote: gdrive:DeepVision/aigvd_c2v2x_v1
  rclone: rclone
