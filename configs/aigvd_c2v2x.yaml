# C2 v2 extra (2026-11-16): the 144 OpenVid-HD reals of the AIGVDBench intervention whose original was missing from the
# aigvd_c2v2 subset (video_id is shared with V2V/I2V fakes, so the first top-up matched fake rows); originals only, for
# C2-G1 on all 500 pairs. Same clips as aigvd_c2v2 (derived from v1 clips, B = 192).
# C2 v2 (2026-11-15, reports/c2_protocol.md §6 in the workspace): C2 v1 + bandwidth bottleneck. After the square crop every
# frame goes 224 -> 192 x 192 (INTER_AREA) -> 224 (INTER_LINEAR), so no source keeps more detail than a 192-px image
# (B picked on a dev half of the intervention reals: C2-G2 r320 0.596 dev, 0.551 holdout). Clips derived from the v1
# clips by scripts/c2/derive_v2.py (workspace); clips.bottleneck does the same in clips.shrink_jpeg.
# C2 v1 processing-controlled protocol (2026-11-14, reports/c2_protocol.md in the workspace): every video gets the
# same clip path, whatever its source: 16 frames on an 8 fps grid (2 s, centered window) -> short side to 224 px
# (INTER_AREA, downscale only) -> centered square crop -> 224 x 224 JPEG q95. Videos that the grid cannot represent
# without upsampling are excluded on EVERY split (filter_eval): fps < 8, duration < 2 s, short side < 224 px.
# Built from configs/aigvd_ctrl8.yaml (same sources); only the validation floor and max_short_side differ.
# AIGVDBench test split (CVPR 2026, arXiv:2601.11035; HF AIGVDBench/AIGVDBench, CC-BY-4.0, downloaded 2026-11-14).
# Test videos only (scripts/aigvdbench/unpack.py): OpenVid-HD reals + open-source T2V/I2V/V2V = the 3,000 Video_id of
# Split/test.jsonl; closed-source sets are test-only (2,000 each). Kept at native fps/resolution (H.264 re-encode).
# Same grid as configs/vif_8fps.yaml: 16 frames on an 8 fps grid, centered window.
# Crop: centered square (2026-11-14), so the aspect ratio cannot leak; as configs/vif_ctrl8.yaml.
raw_root: H:/lab/AIVDetection/data/AIGVDBench/videos
out_root: H:/lab/AIVDetection/data/deepvision_processed/aigvd_c2v2x
quarantine_root: H:/lab/AIVDetection/data/_quarantine_corrupt/aigvd

video_extensions: [.mp4]
ignore_patterns: ["__MACOSX", "/._"]

workers: 6

sources:
