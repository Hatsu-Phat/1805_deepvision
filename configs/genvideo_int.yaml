# GenVideo processing intervention (2026-11-15; C1 evidence (b) for GenVideo, workspace reports/c1_genvideo_intervention.md).
# 500 Youku reals of split train2 (unseen by the p2f heads) as orig / reenc / fps3 / cut2s / cut2s_fps8
# (scripts/genvideo/make_interventions.py in the workspace). Same clip path as the GenVideo dataset_v1 clips
# (configs/data.yaml): DeMamba sampling rule (2 fps when >= 8 s, else 16 frames over the video), DeMamba crop
# (0.10 for this evaluation split, the same for every variant) and squash to 224, so only fps / length differ.
raw_root: H:/lab/AIVDetection/data/deepvision_processed/genvideo_interventions
out_root: H:/lab/AIVDetection/data/deepvision_processed/genvideo_int
quarantine_root: H:/lab/AIVDetection/data/_quarantine_corrupt/genvideo_int

video_extensions: [.mp4]
ignore_patterns: ["__MACOSX", "/._", ".tmp.mp4"]

workers: 6

sources:
  - {name: int_orig, dir: orig, split: genvideo_int, label: 0, generator: youku@orig}
  - {name: int_reenc, dir: reenc, split: genvideo_int, label: 0, generator: youku@reenc}
  - {name: int_fps3, dir: fps3, split: genvideo_int, label: 0, generator: youku@fps3}
  - {name: int_cut2s, dir: cut2s, split: genvideo_int, label: 0, generator: youku@cut2s}
  - {name: int_cut2s_fps8, dir: cut2s_fps8, split: genvideo_int, label: 0, generator: youku@cut2s_fps8}

validation:
  min_duration: 0.5
  min_side: 64
  probe_timeout: 60
  decode_timeout: 120

extraction:
  num_frames: 16
  base_fps: 2
  min_duration_for_base_fps: 8.0
  window: center
  jpeg_quality: 95
  max_short_side: 0
  decode_timeout: 300
  min_free_gb: 50
  output: clips

clips:
  size: 224
  crop: demamba
  jpeg_quality: 95
  keep_native: []

shards:
  videos_per_shard: 3000

drive:
  remote: gdrive:DeepVision/genvideo_int_v1
  rclone: rclone
