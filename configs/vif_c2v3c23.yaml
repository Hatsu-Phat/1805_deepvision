# C2 v3 (2026-11-16, reports/c2_protocol.md §8 in the workspace): C2 v2 + common H.264 generation: frames ->
# 192 x 192 (INTER_AREA) -> libx264 preset medium CRF 23 yuv420p 8 fps 1 GOP -> decode -> 224 (INTER_LINEAR)
# -> JPEG q95 (clips.reencode_frames). T2 view: 16 frames, 2 s. Clips derived from the v2 clips by scripts/c2/derive_v3.py
# (workspace).
# C2 v2 (2026-11-15, reports/c2_protocol.md §6 in the workspace): C2 v1 + bandwidth bottleneck. After the square crop every
# frame goes 224 -> 192 x 192 (INTER_AREA) -> 224 (INTER_LINEAR), so no source keeps more detail than a 192-px image
# (B picked on a dev half of the intervention reals: C2-G2 r320 0.596 dev, 0.551 holdout). Clips derived from the v1
# clips by scripts/c2/derive_v2.py (workspace); clips.bottleneck does the same in clips.shrink_jpeg.
# C2 v1 processing-controlled protocol (2026-11-14, reports/c2_protocol.md in the workspace): every video gets the
# same clip path, whatever its source: 16 frames on an 8 fps grid (2 s, centered window) -> short side to 224 px
# (INTER_AREA, downscale only) -> centered square crop -> 224 x 224 JPEG q95. Videos that the grid cannot represent
# without upsampling are excluded on EVERY split (filter_eval): fps < 8, duration < 2 s, short side < 224 px.
# Built from configs/vif_ctrl8.yaml (same sources); only the validation floor and max_short_side differ.
# G2 (2026-11-14): processing-controlled ViF (vif_train + vif_test): 16 frames on an 8 fps grid, CENTERED SQUARE crop -> 224.
# (`base_fps: 8` -> ffmpeg -r <fps>), centered window; everything else as configs/vif.yaml.
# Own out_root and Drive folder; the manifest is a copy of vif/manifests/vif_test_videos.csv.
# ViF data (Skyra, arXiv:2512.15693; HF JoeLeelyf/ViF-CoT-4K and JoeLeelyf/ViF-Bench, downloaded 2026-11-09).
# Same pipeline and options as configs/data.yaml, but its own raw/out roots and Drive folder, so the GenVideo
# manifests, shards and features are never touched. Built from source_videos.zip (parsed_frames.zip unused).
#   vif_train = ViF-CoT-4K: 3,502 reals (Panda-70M, Kinetics-400) + 3,502 fakes paired by file name, 7 generators
#   vif_test  = ViF-Bench: 165 reals + 2,995 fakes, 19 generators; each fake shares its file name with one real
# Reals in a pair keep the generator of their source dataset; the pair is the video_id (file stem).
# Crop: every vif split gets the DeMamba test crop (0.10, real and fake alike).

