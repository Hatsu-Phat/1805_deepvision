validation:
  min_duration: 2.0
  min_side: 224
  min_fps: 8
  filter_eval: true
  probe_timeout: 60
  decode_timeout: 120

extraction:
  num_frames: 16
  base_fps: 8
  min_duration_for_base_fps: 2.0
  window: center
  jpeg_quality: 95
  max_short_side: 224
  decode_timeout: 300
  min_free_gb: 50
  output: clips

clips:
  size: 224
  crop: square
  jpeg_quality: 95
  keep_native: []
  bottleneck: 192
  reencode_crf: 23

shards:
  videos_per_shard: 3000

drive:
  remote: gdrive:DeepVision/vif_c2v3c23_v1
  rclone: rclone
