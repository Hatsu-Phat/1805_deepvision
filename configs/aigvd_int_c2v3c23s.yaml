# C2 v3 (2026-11-16, reports/c2_protocol.md §8 in the workspace): C2 v2 + common H.264 generation: frames ->
# 192 x 192 (INTER_AREA) -> libx264 preset medium CRF 23 yuv420p 8 fps 1 GOP -> decode -> 224 (INTER_LINEAR)
# -> JPEG q95 (clips.reencode_frames). T1 short view: frames 4-11 of the v2 clip (centered 1 s, 8 frames). Clips derived from the v2 clips by scripts/c2/derive_v3.py
# (workspace).
# C2 v2 (2026-11-15, reports/c2_protocol.md §6 in the workspace): C2 v1 + bandwidth bottleneck. After the square crop every
# frame goes 224 -> 192 x 192 (INTER_AREA) -> 224 (INTER_LINEAR), so no source keeps more detail than a 192-px image
# (B picked on a dev half of the intervention reals: C2-G2 r320 0.596 dev, 0.551 holdout). Clips derived from the v1
# clips by scripts/c2/derive_v2.py (workspace); clips.bottleneck does the same in clips.shrink_jpeg.
# C2 v1 processing-controlled protocol (2026-11-14, reports/c2_protocol.md in the workspace): every video gets the
# same clip path, whatever its source: 16 frames on an 8 fps grid (2 s, centered window) -> short side to 224 px
# (INTER_AREA, downscale only) -> centered square crop -> 224 x 224 JPEG q95. Videos that the grid cannot represent
# without upsampling are excluded on EVERY split (filter_eval): fps < 8, duration < 2 s, short side < 224 px.
# Built from configs/aigvd_int_ctrl8.yaml (same sources); only the validation floor and max_short_side differ.
# Processing intervention (2026-11-14): 500 AIGVDBench OpenVid-HD reals re-encoded (reenc, 1080p) or
# downscaled to 720p / 480p / 320p (scripts/aigvdbench/make_interventions.py). Same clip options as
# configs/aigvd_ctrl8.yaml; own out_root and Drive folder. The originals are in split aigvd_test (same file names).
raw_root: H:/lab/AIVDetection/data/deepvision_processed/aigvd_interventions
out_root: H:/lab/AIVDetection/data/deepvision_processed/aigvd_int_c2v3c23s
quarantine_root: H:/lab/AIVDetection/data/_quarantine_corrupt/aigvd_int

video_extensions: [.mp4]
ignore_patterns: ["__MACOSX", "/._", ".tmp.mp4", "/_unused/"]

workers: 6

sources:
  - {name: int_reenc, dir: reenc, split: aigvd_int, label: 0, generator: OpenVid-HD@reenc}
  - {name: int_r720, dir: r720, split: aigvd_int, label: 0, generator: OpenVid-HD@r720}
  - {name: int_r480, dir: r480, split: aigvd_int, label: 0, generator: OpenVid-HD@r480}
  - {name: int_r320, dir: r320, split: aigvd_int, label: 0, generator: OpenVid-HD@r320}

validation:
  min_duration: 2.0
  min_side: 224
  min_fps: 8
  filter_eval: true
  probe_timeout: 60
  decode_timeout: 120

extraction:
  num_frames: 16
  base_fps: 8
  min_duration_for_base_fps: 2.0
  window: center
  jpeg_quality: 95
  max_short_side: 224
  decode_timeout: 300
  min_free_gb: 50
  output: clips

clips:
  size: 224
  crop: square
  jpeg_quality: 95
  keep_native: []
  bottleneck: 192
  reencode_crf: 23

shards:
  videos_per_shard: 3000

drive:
  remote: gdrive:DeepVision/aigvd_int_c2v3c23s_v1
  rclone: rclone
