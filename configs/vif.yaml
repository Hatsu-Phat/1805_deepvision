  - {name: bench_hailuo, dir: ViF-Bench/source_videos/Fake/hailuo, split: vif_test, label: 1, generator: hailuo}
  - {name: bench_pika_v2, dir: ViF-Bench/source_videos/Fake/pika-v2, split: vif_test, label: 1, generator: pika-v2}
  - {name: bench_pixverse_v4_5, dir: ViF-Bench/source_videos/Fake/pixverse-v4-5, split: vif_test, label: 1, generator: pixverse-v4-5}
  - {name: bench_kling_v1, dir: ViF-Bench/source_videos/Fake/kling-v1, split: vif_test, label: 1, generator: kling-v1}
  - {name: bench_sora_2, dir: ViF-Bench/source_videos/Fake/sora-2, split: vif_test, label: 1, generator: sora-2}

validation:
  min_duration: 0.5
  min_side: 64
  probe_timeout: 60
  decode_timeout: 120

extraction:
  num_frames: 16
  base_fps: 2
  min_duration_for_base_fps: 8.0
  window: center
  jpeg_quality: 95
  max_short_side: 0
  decode_timeout: 300
  min_free_gb: 50
  output: clips

clips:
  size: 224
  crop: demamba
  jpeg_quality: 95
  keep_native: []

shards:
  videos_per_shard: 3000

drive:
  remote: gdrive:DeepVision/vif_v1
  rclone: rclone
